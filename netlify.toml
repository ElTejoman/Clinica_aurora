# =============================================================================
# Demo en Netlify (el sitio definitivo va en Hostinger: ver README §6)
#
#   Netlify › Add new site › Import from GitHub › este repositorio, rama main.
#   No hay que configurar nada más: todo sale de este archivo.
#
# - Sitio 100 % estático: `next build` genera out/ (output: "export").
# - NEXT_PUBLIC_SITE_URL toma la URL de la demo ($URL, la pone Netlify), así
#   las canónicas, el sitemap y la vista previa al compartir apuntan a la demo
#   y no al dominio definitivo (que aún no existe).
# - X-Robots-Tag: noindex → Google no indexa la demo (evita contenido duplicado
#   cuando se publique el dominio real).
# =============================================================================

[build]
  command = "NEXT_PUBLIC_SITE_URL=${URL:-$DEPLOY_PRIME_URL} npm run build"
  publish = "out"

# Node: se toma de .nvmrc.

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# JS, CSS y fuentes llevan hash en el nombre: caché de 1 año.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes de public/ (sin hash): 1 semana.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
